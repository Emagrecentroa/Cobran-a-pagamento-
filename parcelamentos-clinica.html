<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcelamentos — Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #FAFAF8;
    color: #1F2A24;
    padding: 20px 16px 100px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  .title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; color: #1F2A24; }
  .subtitle { font-size: 13.5px; color: #8B8A80; margin-top: 2px; }
  .stats { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
  .stat-card {
    flex: 1; min-width: 140px; background: #fff; border: 1px solid #EAE8DF;
    border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  }
  .stat-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
  .stat-count { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 12px; color: #6B6A62; margin-top: 2px; }

  .empty {
    text-align: center; padding: 56px 20px; color: #6B6A62;
    border: 1px dashed #D8D6CC; border-radius: 16px; background: #FCFCFA;
  }
  .empty .t { font-family: 'Fraunces', serif; font-size: 20px; color: #1F2A24; margin-bottom: 6px; }
  .empty .d { font-size: 14px; margin-bottom: 18px; }

  .btn-primary {
    background: #3D6B5C; color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; font-family: inherit;
  }

  .card { background: #fff; border: 1px solid #EAE8DF; border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
  .card-top { padding: 16px 16px 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .p-name { font-family: 'Fraunces', serif; font-size: 17px; }
  .p-meta { font-size: 12.5px; color: #8B8A80; margin-top: 2px; }
  .p-meta .overdue { color: #C1523D; font-weight: 600; }
  .del-btn { background: none; border: none; color: #B9B8B0; cursor: pointer; padding: 4px; }

  .dots { display: flex; gap: 5px; margin-top: 12px; flex-wrap: wrap; }
  .dot {
    width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; border: 1.5px solid;
  }

  .next-box {
    margin-top: 14px; display: flex; align-items: center; justify-content: space-between;
    border-radius: 11px; padding: 10px 12px;
  }
  .next-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
  .next-value { font-size: 14px; font-weight: 600; margin-top: 1px; }
  .wa-btn {
    background: #25D366; color: #fff; border: none; border-radius: 9px;
    padding: 9px 12px; display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; text-decoration: none; flex-shrink: 0;
  }
  .all-paid { margin-top: 14px; font-size: 13px; color: #3F5C44; background: #EDF3EA; border-radius: 11px; padding: 10px 12px; font-weight: 600; }

  .toggle-btn { margin-top: 10px; background: none; border: none; color: #6B6A62; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; font-family: inherit; }

  .installments { border-top: 1px solid #F0EFE9; background: #FCFCFA; display: none; }
  .installments.open { display: block; }
  .inst-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #F0EFE9; gap: 10px; }
  .inst-left { display: flex; align-items: center; gap: 10px; }
  .inst-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .inst-name { font-size: 13.5px; font-weight: 600; }
  .inst-date { font-size: 12px; }
  .inst-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn { border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #DEDCD1; background: #fff; }
  .icon-btn.wa { background: #EAF8EE; color: #1B8A3E; border: none; text-decoration: none; }
  .icon-btn.paid { background: #EDF3EA; border-color: #6B8F71; color: #3F5C44; }

  .fab {
    position: fixed; bottom: 22px; right: 20px; width: 54px; height: 54px; border-radius: 50%;
    background: #3D6B5C; color: #fff; border: none; box-shadow: 0 6px 18px rgba(61,107,92,0.35);
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 26px;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(31,42,36,0.4); z-index: 50;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 18px 18px 0 0; padding: 22px 20px 26px;
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-title { font-family: 'Fraunces', serif; font-size: 19px; }
  .close-btn { background: none; border: none; cursor: pointer; color: #6B6A62; font-size: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 600; color: #6B6A62; margin-bottom: 5px; display: block; }
  .form-input {
    width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid #DEDCD1;
    font-size: 14px; font-family: inherit; background: #FCFCFA; color: #1F2A24;
  }
  .form-input:focus { outline: none; border-color: #3D6B5C; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .freq-row { display: flex; gap: 8px; }
  .freq-btn {
    flex: 1; padding: 9px 0; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 600;
    border: 1px solid #DEDCD1; background: #fff; color: #6B6A62; font-family: inherit;
  }
  .freq-btn.active { border: 1.5px solid #3D6B5C; background: #EDF3EA; color: #3D6B5C; }
  .save-btn {
    margin-top: 6px; width: 100%; padding: 13px 0; border-radius: 10px; border: none;
    background: #3D6B5C; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .save-btn:disabled { background: #D8D6CC; cursor: not-allowed; }
</style>
</head>
<body>

<div class="wrap">
  <div>
    <div class="title">Parcelamentos</div>
    <div class="subtitle">Acompanhe os pagamentos das pacientes e cobre pelo WhatsApp</div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="content"></div>
</div>

<button class="fab" id="fabBtn" style="display:none">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Novo parcelamento</div>
      <button class="close-btn" id="closeModal">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Nome da paciente</label>
      <input class="form-input" id="fName" placeholder="Ex: Maria Silva">
    </div>
    <div class="form-group">
      <label class="form-label">WhatsApp (com DDD)</label>
      <input class="form-input" id="fPhone" placeholder="Ex: (11) 91234-5678">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Valor da parcela</label>
        <input class="form-input" id="fValue" type="number" min="0" step="0.01" placeholder="0,00">
      </div>
      <div class="form-group">
        <label class="form-label">Nº de parcelas</label>
        <input class="form-input" id="fCount" type="number" min="1" placeholder="Ex: 6">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Frequência</label>
      <div class="freq-row" id="freqRow">
        <button class="freq-btn active" data-freq="semanal">Semanal</button>
        <button class="freq-btn" data-freq="quinzenal">Quinzenal</button>
        <button class="freq-btn active-default" data-freq="mensal">Mensal</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Data da 1ª parcela</label>
      <input class="form-input" id="fStart" type="date">
    </div>
    <button class="save-btn" id="saveBtn" disabled>Salvar parcelamento</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'parcelamentos-pacientes-v1';
const FREQ_LABEL = { semanal: 'Semanal', quinzenal: 'Quinzenal', mensal: 'Mensal' };
const FREQ_DAYS = { semanal: 7, quinzenal: 14 };
let selectedFreq = 'mensal';

function loadPatients() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function savePatients(patients) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
}
let patients = loadPatients();

function addInterval(dateStr, freq, n) {
  const d = new Date(dateStr + 'T00:00:00');
  if (freq === 'mensal') d.setMonth(d.getMonth() + n);
  else d.setDate(d.getDate() + FREQ_DAYS[freq] * n);
  return d.toISOString().slice(0, 10);
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtMoney(v) { return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function onlyDigits(s) { return (s || '').replace(/\D/g, ''); }

function installmentState(inst) {
  if (inst.status === 'pago') return 'pago';
  const today = todayStr();
  if (inst.dueDate < today) return 'atrasado';
  if (inst.dueDate === today) return 'hoje';
  return 'pendente';
}
const STATE_STYLE = {
  pago:      { bg: '#EDF3EA', ring: '#6B8F71', text: '#3F5C44', label: 'Pago' },
  atrasado:  { bg: '#FBEBE7', ring: '#C1523D', text: '#8F3A29', label: 'Atrasado' },
  hoje:      { bg: '#FBF3E2', ring: '#C99A3C', text: '#8A6A22', label: 'Vence hoje' },
  pendente:  { bg: '#F1F1EE', ring: '#B9B8B0', text: '#6B6A62', label: 'Pendente' },
};

function whatsappLink(phone, message) {
  const digits = onlyDigits(phone);
  const withCountry = digits.length <= 11 ? '55' + digits : digits;
  return `https://wa.me/${withCountry}?text=${encodeURIComponent(message)}`;
}
function buildMessage(name, inst) {
  const st = installmentState(inst);
  if (st === 'atrasado') {
    return `Olá ${name}! Tudo bem? Passando para lembrar que a parcela ${inst.n} (${fmtMoney(inst.value)}), com vencimento em ${fmtDate(inst.dueDate)}, ainda está em aberto. Podemos combinar o pagamento?`;
  }
  return `Olá ${name}! Tudo bem? Passando para lembrar do pagamento da parcela ${inst.n} no valor de ${fmtMoney(inst.value)}, com vencimento em ${fmtDate(inst.dueDate)}. Qualquer dúvida estou à disposição!`;
}

function computeStats() {
  const today = todayStr();
  const in7 = addInterval(today, 'semanal', 1);
  let dueToday = 0, overdue = 0, dueSoon = 0;
  patients.forEach(p => p.installments.forEach(i => {
    if (i.status === 'pago') return;
    if (i.dueDate === today) dueToday++;
    else if (i.dueDate < today) overdue++;
    else if (i.dueDate <= in7) dueSoon++;
  }));
  return { dueToday, overdue, dueSoon };
}

function renderStats() {
  const s = computeStats();
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat-card"><div class="stat-icon" style="background:#C1523D22;color:#C1523D">⚠</div><div><div class="stat-count">${s.overdue}</div><div class="stat-label">Atrasadas</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#C99A3C22;color:#C99A3C">⏱</div><div><div class="stat-count">${s.dueToday}</div><div class="stat-label">Vencem hoje</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#3D6B5C22;color:#3D6B5C">✓</div><div><div class="stat-count">${s.dueSoon}</div><div class="stat-label">Próx. 7 dias</div></div></div>
  `;
}

function renderDots(patient) {
  return patient.installments.map(inst => {
    const st = STATE_STYLE[installmentState(inst)];
    return `<div class="dot" title="Parcela ${inst.n} · ${fmtDate(inst.dueDate)}" style="background:${st.bg};border-color:${st.ring};color:${st.text}">${inst.status === 'pago' ? '✓' : inst.n}</div>`;
  }).join('');
}

function renderInstallments(patient) {
  return patient.installments.map(inst => {
    const st = STATE_STYLE[installmentState(inst)];
    const waBtn = inst.status !== 'pago'
      ? `<a class="icon-btn wa" href="${whatsappLink(patient.phone, buildMessage(patient.name, inst))}" target="_blank" rel="noopener noreferrer">💬</a>`
      : '';
    return `
      <div class="inst-row">
        <div class="inst-left">
          <div class="inst-dot" style="background:${st.ring}"></div>
          <div>
            <div class="inst-name">Parcela ${inst.n} · ${fmtMoney(inst.value)}</div>
            <div class="inst-date" style="color:${st.text}">${fmtDate(inst.dueDate)} · ${st.label}</div>
          </div>
        </div>
        <div class="inst-actions">
          ${waBtn}
          <button class="icon-btn ${inst.status === 'pago' ? 'paid' : ''}" onclick="togglePaid('${patient.id}', ${inst.n})">✓</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderCard(patient) {
  const nextPending = patient.installments.find(i => i.status !== 'pago');
  const paidCount = patient.installments.filter(i => i.status === 'pago').length;
  const total = patient.installments.length;
  const overdueCount = patient.installments.filter(i => installmentState(i) === 'atrasado').length;

  let nextHtml;
  if (nextPending) {
    const st = STATE_STYLE[installmentState(nextPending)];
    nextHtml = `
      <div class="next-box" style="background:${st.bg}">
        <div>
          <div class="next-label" style="color:${st.text}">Próxima · parcela ${nextPending.n}</div>
          <div class="next-value">${fmtMoney(nextPending.value)} — ${fmtDate(nextPending.dueDate)}</div>
        </div>
        <a class="wa-btn" href="${whatsappLink(patient.phone, buildMessage(patient.name, nextPending))}" target="_blank" rel="noopener noreferrer">💬 Cobrar</a>
      </div>
    `;
  } else {
    nextHtml = `<div class="all-paid">Todas as parcelas foram pagas ✓</div>`;
  }

  return `
    <div class="card">
      <div class="card-top">
        <div class="card-head">
          <div>
            <div class="p-name">${patient.name}</div>
            <div class="p-meta">${FREQ_LABEL[patient.freq]} · ${paidCount}/${total} pagas${overdueCount > 0 ? ` · <span class="overdue">${overdueCount} atrasada${overdueCount > 1 ? 's' : ''}</span>` : ''}</div>
          </div>
          <button class="del-btn" onclick="deletePatient('${patient.id}')">🗑</button>
        </div>
        <div class="dots">${renderDots(patient)}</div>
        ${nextHtml}
        <button class="toggle-btn" onclick="toggleOpen('${patient.id}')">
          <span id="chevron-${patient.id}">▾</span> <span id="toggleLabel-${patient.id}">Ver todas as parcelas</span>
        </button>
      </div>
      <div class="installments" id="inst-${patient.id}">${renderInstallments(patient)}</div>
    </div>
  `;
}

function render() {
  renderStats();
  const content = document.getElementById('content');
  const fab = document.getElementById('fabBtn');
  if (patients.length === 0) {
    fab.style.display = 'none';
    content.innerHTML = `
      <div class="empty">
        <div class="t">Nenhum parcelamento cadastrado</div>
        <div class="d">Cadastre a paciente e o plano de pagamento para começar a acompanhar as cobranças.</div>
        <button class="btn-primary" onclick="openModal()">+ Novo parcelamento</button>
      </div>
    `;
  } else {
    fab.style.display = 'flex';
    const sorted = [...patients].sort((a, b) => {
      const na = a.installments.find(i => i.status !== 'pago');
      const nb = b.installments.find(i => i.status !== 'pago');
      if (!na && !nb) return 0;
      if (!na) return 1;
      if (!nb) return -1;
      return na.dueDate.localeCompare(nb.dueDate);
    });
    content.innerHTML = sorted.map(renderCard).join('');
  }
}

function toggleOpen(id) {
  const el = document.getElementById('inst-' + id);
  const chevron = document.getElementById('chevron-' + id);
  const label = document.getElementById('toggleLabel-' + id);
  const isOpen = el.classList.toggle('open');
  chevron.textContent = isOpen ? '▴' : '▾';
  label.textContent = isOpen ? 'Ocultar parcelas' : 'Ver todas as parcelas';
}

function togglePaid(patientId, n) {
  patients = patients.map(p => {
    if (p.id !== patientId) return p;
    return { ...p, installments: p.installments.map(i => i.n === n ? { ...i, status: i.status === 'pago' ? 'pendente' : 'pago' } : i) };
  });
  savePatients(patients);
  render();
}

function deletePatient(id) {
  if (!confirm('Remover este parcelamento?')) return;
  patients = patients.filter(p => p.id !== id);
  savePatients(patients);
  render();
}

function openModal() {
  document.getElementById('fName').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fValue').value = '';
  document.getElementById('fCount').value = '';
  document.getElementById('fStart').value = todayStr();
  selectedFreq = 'mensal';
  document.querySelectorAll('.freq-btn').forEach(b => b.classList.toggle('active', b.dataset.freq === 'mensal'));
  validateForm();
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModalFn() { document.getElementById('modalOverlay').classList.remove('open'); }

function validateForm() {
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const value = Number(document.getElementById('fValue').value);
  const count = Number(document.getElementById('fCount').value);
  const ok = name && phone && value > 0 && count > 0;
  document.getElementById('saveBtn').disabled = !ok;
}

document.getElementById('fabBtn').addEventListener('click', openModal);
document.getElementById('closeModal').addEventListener('click', closeModalFn);
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModalFn(); });
['fName','fPhone','fValue','fCount'].forEach(id => document.getElementById(id).addEventListener('input', validateForm));
document.getElementById('freqRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.freq-btn');
  if (!btn) return;
  selectedFreq = btn.dataset.freq;
  document.querySelectorAll('.freq-btn').forEach(b => b.classList.toggle('active', b === btn));
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const value = Number(document.getElementById('fValue').value);
  const count = parseInt(document.getElementById('fCount').value, 10);
  const start = document.getElementById('fStart').value || todayStr();

  const installments = Array.from({ length: count }, (_, i) => ({
    n: i + 1,
    value,
    dueDate: addInterval(start, selectedFreq, i),
    status: 'pendente',
  }));

  patients.push({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    name, phone, freq: selectedFreq, installments,
  });
  savePatients(patients);
  closeModalFn();
  render();
});

render();
</script>
</body>
</html>
